name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run fmt:check

      - run: pnpm run lint:check

      - run: pnpm test

      - run: pnpm run build
