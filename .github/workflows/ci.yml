name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run fmt:check

      - run: pnpm test

      - run: pnpm run build

      - run: pnpm --filter @aia-kit/explorer typecheck

      - run: pnpm --filter @aia-kit/explorer build
