name: Release

# Publishes aia-kit to npm and creates the GitHub release when a version tag
# is pushed. See "Releasing" in the README for the steps.
#
# Authentication is npm trusted publishing: npm trusts this repository and
# this workflow file, so there is no token to store. That has to be set up
# once in the package's settings on npmjs.com.
on:
  push:
    tags: ["v*"]

permissions: {}

# Never run two releases at once, and never cancel one halfway through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # prove this workflow's identity to npm, and sign provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the main-branch check below needs history

      # Installs the node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Check the tag
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 2.1.0-beta.1 and the like go out under "next", so "latest" stays stable.
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm run build

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          # A re-run after a failure further down must not try to publish twice.
          if npm view "aia-kit@$VERSION" version >/dev/null 2>&1; then
            echo "aia-kit@$VERSION is already on npm; skipping"
            exit 0
          fi
          # The checkout is a detached tag, which pnpm's branch check would reject;
          # the step above already established that it is on main.
          pnpm publish --no-git-checks --provenance --tag "$DIST_TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $PRERELEASE
